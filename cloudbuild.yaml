steps:
  # Tests first. A failing step fails the build, so a broken commit never becomes an
  # image, let alone a deployment.
  #
  # There was no test step at all until August 2026: 391 Jest tests that ran only when
  # somebody remembered to run them. And until Sep 2026 this file itself never ran: the
  # trigger was the one the Cloud Run console generates, with its own inline build (no
  # tests, no cache, pushing to cloud-run-source-deploy). It now names this file. If a
  # deploy ever skips the test step again, check the trigger before anything else:
  #   gcloud builds triggers describe rmgpgab-league-site-europe-west2-stockport-badminton-league-hbz That works while the person deploying is the person
  # who wrote them; the moment it isn't, the suite stops being a safety net and becomes
  # documentation of what used to be checked.
  #
  # These need no database. `__tests__/setup.js` supplies the env they read and every
  # suite mocks db_connect, which is why this can run before anything else exists. The
  # model SQL is tested against a real Postgres by the `db` step below.
  #
  # Playwright deliberately isn't here. The reason it gave until Oct 2026 — that the only
  # database was production — went with HARD-13 and the `pg` service below; what is left
  # is a decision (browsers in the build image, minutes per build) recorded in
  # REARCH-08. Until it is taken, the browser suite is a local gate (`npm run test:all`)
  # run by whoever merges.
  - name: 'node:24'
    id: 'test'
    waitFor: ['-']
    entrypoint: bash
    # Two workers, not Jest's default for this 2-CPU machine (one process, in band).
    # In band, every suite's leftovers stay in one heap, and on 17 Oct 2026 that heap
    # reached Node's ~2 GB limit on suite 132 of 133 and aborted the build (exit 134,
    # no test failed). Workers are recycled past `workerIdleMemoryLimit` (package.json),
    # so nothing accumulates however many suites are added. Reproduced locally with
    # NODE_OPTIONS=--max-old-space-size=1536: `jest -i` dies, this passes.
    args:
      - '-c'
      - |
        set -e
        npm ci
        npm test -- --maxWorkers=2
        # REARCH-01: type-check the files that have opted in with `// @ts-check` —
        # db/ and each model converted to the typed query layer. Under a second.
        npm run typecheck

  # A real Postgres for the `db` Jest project (REARCH-08). Started first and in parallel
  # with the step above, so its image pull costs nothing. Cloud Build runs every step on
  # the `cloudbuild` Docker network, so the next steps reach it as host `pg`. Nothing is
  # in it but what the suite builds: migrations/ and tools/local-db/test-seed.sql.
  - name: 'gcr.io/cloud-builders/docker'
    id: 'pg'
    waitFor: ['-']
    args: ['run', '-d', '--network', 'cloudbuild', '--name', 'pg',
           '-e', 'POSTGRES_PASSWORD=postgres', 'postgres:17']

  - name: 'postgres:17'
    id: 'pg-ready'
    waitFor: ['pg']
    entrypoint: bash
    args:
      - '-c'
      - 'for _ in $$(seq 1 60); do pg_isready -q -h pg -U postgres && exit 0; sleep 1; done; echo "pg never became ready" >&2; exit 1'

  # Model SQL against that database, every test in a rolled-back transaction. After
  # `test` because that step's `npm ci` is what fills node_modules in /workspace; a
  # failure here stops the build before an image is made, like a failure there.
  - name: 'node:24'
    id: 'db'
    waitFor: ['test', 'pg-ready']
    entrypoint: bash
    env:
      - 'TEST_DATABASE_URL=postgresql://postgres:postgres@pg:5432/sdbl_test'
    # Then the types the typed query layer checks against (db/schema.d.ts) are regenerated
    # from the database test:db just built out of migrations/, and compared with the
    # committed copy: a migration whose types were not regenerated fails here (REARCH-01).
    args: ['-c', 'set -e; npm run test:db; npm run db:types -- --verify']

  # Pull the previous image so its layers seed the build cache below.
  # First ever build (no :latest yet) is a harmless no-op thanks to `|| true`.
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:latest || true

  # --cache-from reuses the pulled image's layers. Because the Dockerfile copies
  # package*.json + runs `npm ci` before copying source, the (slow) dependency
  # layer is skipped whenever package*.json is unchanged.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--cache-from'
      - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:latest'
      - '-t'
      - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:$COMMIT_SHA'
      - '-t'
      - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '--all-tags'
      - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app'

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'league-site'
      - '--image'
      - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:$COMMIT_SHA'
      - '--region'
      - 'europe-west2'
      - '--platform'
      - 'managed'
      - '--project'
      - 'stockport-badminton-map'

images:
  - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:$COMMIT_SHA'
  - 'europe-west2-docker.pkg.dev/stockport-badminton-map/league-site/app:latest'

# Required, not cosmetic: the trigger runs as a named service account, and Cloud Build
# refuses such a build unless it says where its logs go.
options:
  logging: CLOUD_LOGGING_ONLY
